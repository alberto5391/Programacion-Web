<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plagas por zona</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/supervisor.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <!-- Barra superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <i class="bi bi-bug me-2"></i>
                Plagas por zona
            </a>

            <div class="d-flex align-items-center gap-2">

                <a href="../index.html" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i>
                    Inicio
                </a>

                <a href="notificaciones.html" class="btn btn-primary btn-sm">
                    <i class="bi bi-bell"></i>
                    Notificaciones
                </a>

            </div>

        </div>

    </nav>


    <!-- Contenido -->
    <div class="container">

        <div class="card shadow-sm">

            <div class="card-header bg-dark text-white">
                <i class="bi bi-geo-alt me-2"></i>
                Plagas detectadas por zona
            </div>

            <div class="card-body">

                <p class="text-muted">
                    Cantidad de plagas detectadas en cada zona de Tabasco.
                </p>

                <canvas id="graficaZonas"></canvas>

            </div>

        </div>


        <div class="mt-4">

            <a href="supervisor-dashboard.html" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i>
                Regresar al menú
            </a>

        </div>

    </div>


    <!-- Gráfica -->
    <script>

        const ctx = document.getElementById('graficaZonas');

        new Chart(ctx, {

            type: 'radar',

            data: {

                labels: [
                    'Chontalpa',
                    'Centro',
                    'Ríos',
                    'Pantanos',
                    'Sierra'
                ],

                datasets: [{

                    label: 'Plagas detectadas',

                    data: [35, 50, 25, 20, 30],

                    borderWidth: 2,

                    pointRadius: 5,

                    pointHoverRadius: 7,

                    fill: true

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        display: true

                    }

                },

                scales: {

                    r: {

                        beginAtZero: true,

                        title: {

                            display: true,

                            text: 'Cantidad de plagas'

                        }

                    }

                }

            }

        });

    </script>

</body>

</html>
