<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAGUE - Evidencias</title>
</head>
<body>
    <h1>Módulo de Evidencias Fotográficas</h1>

    <!-- Inicio del bloque para el RF24: Carga de evidencias fotográficas -->
    <h2>Subir Nueva Evidencia</h2>
    <form action="#" method="POST" enctype="multipart/form-data">
        <label>ID Campaña:</label>
        <input type="text" name="id_campana" required><br><br>
        
        <label>Seleccionar Foto:</label>
        <input type="file" name="foto" accept="image/*" required><br><br>
        
        <button type="submit">Cargar Evidencia</button>
    </form>
    <!-- Fin del bloque RF24 -->

    <hr>

    <!-- Inicio del bloque para el RF25: Consulta de evidencias -->
    <h2>Consultar Evidencias</h2>
    <form action="#" method="GET">
        <label>Buscar por ID Campaña:</label>
        <input type="text" name="buscar_campana">
        <button type="submit">Buscar</button>
    </form>

    <br>
    <a href="supervisor-dashboard.html">Volver al menu</a>
</body>
</html>
