    <div class="container">
    <h6>Gestión y Registro de Campañas (RF12)</h6>

    <form>

        <div class="mb-3">
            <label for="nombre_camapaña" class="form-label">Nombre de la campaña</label>
            <input type="text" class="form-control" id="nombre_camapaña" placeholder="Ej: Genesis">
        </div>
        <div class="mb-3">
            <label for="zona_atendida" class="form-label">Zona atendida</label>
            <input type="text" class="form-control" id="zona_atendida" placeholder="Ej: Zona norte">
        </div>

        <div class="form-floating mb-3">
    <input type="date"
           class="form-control"
           id="fecha_campana"
           name="fecha_campana">

    <label for="fecha_campana">Fecha de la campaña</label>
        </div>

        <h6>Asignación de personal (RF13)</h6>

        <div class="mb-3">
            <label for="tecnicos" class="form-label">Técnicos responsables:</label>
            <select class="form-select" aria-label="Default select example" id="tecnicos" name="tecnicos" >
                <option selected>Seleccionar tecnico</option>
                <option value="1">Tecnico 1</option>
                <option value="2">Tecnico 2</option>
                <option value="3">Tecnico 3</option>
            </select>
        </div>




        <button type="submit" 
                formaction="supervisor-dashboard.html"
                class="btn btn-primary mt-5">
            Crear Campaña
        </button>

    </form>

    <br><br>

    <a href="supervisor-dashboard.html">← Regresar al menú</a>
</div>
