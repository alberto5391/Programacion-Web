<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/tecnico.css">
    <title>Aplicación de Tratamientos</title>
</head>
<body>
    <!-- Barra Superior de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                Aplicación de Tratamientos
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="../index.html" class="btn btn-outline-light btn-sm">
                    ← Inicio
                </a>
                <a href="notificaciones.html" class="btn btn-primary btn-sm">
                    Notificaciones
                </a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">Aplicación de Tratamientos</h2>
        <form>
            <!-- Registro de aplicación de tratamiento -->
            <fieldset class="border rounded p-4 mb-4 shadow-sm">
                <legend class="float-none w-auto px-2">
                    Registro de aplicación de tratamiento (RF16)
                </legend>
                <div class="mb-3">
                    <label for="zona_tratamiento" class="form-label">
                        Zona atendida:
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="zona_tratamiento"
                        name="zona_tratamiento"
                        placeholder="Ingrese la zona atendida">
                </div>
                <div class="mb-3">
                    <label for="fecha_tratamiento" class="form-label">
                        Fecha:
                    </label>
                    <input
                        type="date"
                        class="form-control"
                        id="fecha_tratamiento"
                        name="fecha_tratamiento">
                </div>
                <div class="mb-3">
                    <label for="personal_resp" class="form-label">
                        Personal responsable:
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="personal_resp"
                        name="personal_resp"
                        placeholder="Ingrese el nombre del responsable">
                </div>
            </fieldset>
            <!-- Asociación de productos con aplicaciones -->
            <fieldset class="border rounded p-4 mb-4 shadow-sm">
                <legend class="float-none w-auto px-2">
                    Asociación de productos con aplicaciones (RF18)
                </legend>
                <div class="mb-3">
                    <label for="producto_usado" class="form-label">
                        Producto utilizado:
                    </label>
                    <select
                        class="form-select"
                        id="producto_usado"
                        name="producto_usado">
                        <option value="prod1">Producto A</option>
                        <option value="prod2">Producto B</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="cantidad_prod" class="form-label">
                        Cantidad aplicada:
                    </label>
                    <input
                        type="number"
                        class="form-control"
                        id="cantidad_prod"
                        name="cantidad_prod"
                        placeholder="Ingrese la cantidad aplicada"
                        min="0"
                        step="any">
                </div>
            </fieldset>
            <!-- Botones -->
            <div class="d-flex flex-wrap gap-2 mt-4 mb-4">
                <button
                    type="submit"
                    formaction="tecnico_dashboard.html"
                    class="btn btn-primary">
                    Guardar
                </button>
                <a href="tecnico_dashboard.html"
                   class="btn btn-outline-secondary">
                    ← Regresar al menú
                </a>
            </div>
        </form>
    </div>
</body>
</html>
