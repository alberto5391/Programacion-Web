<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Tu CSS Personalizado -->
    <link rel="stylesheet" href="../css/tecnico.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .notification-card {
            transition: all 0.2s ease-in-out;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.06)!important;
        }
    </style>
</head>
<body>

    <!-- Header Limpio -->
    <header class="bg-white border-bottom py-3 mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a href="tecnico_dashboard.html" class="btn btn-light border btn-sm text-secondary">
                    <i class="bi bi-arrow-left"></i> Regresar al menú
                </a>
                <h1 class="h4 mb-0 fw-bold text-dark">Panel de Alertas</h1>
            </div>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fw-medium">
                <i class="bi bi-bell-fill me-1"></i> RF19 Activo
            </span>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="container pb-5" style="max-width: 800px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="text-uppercase text-muted fw-bold fs-7 mb-0">Notificaciones y recordatorios automáticos (RF19)</h6>
            <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-check2-all"></i> Marcar todas como leídas</button>
        </div>

        <!-- Lista de Alertas Estilo Tarjetas -->
        <div class="d-flex flex-column gap-3">

            <!-- Alerta 1 -->
            <div class="card notification-card bg-white p-3 shadow-sm border-start border-warning border-4">
                <div class="d-flex align-items-start gap-3">
                    <div class="bg-warning-subtle text-warning p-2 rounded-3 fs-4">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="mb-0 fw-semibold text-dark">Alerta</h6>
                            <span class="text-muted fs-8"><i class="bi bi-clock"></i> 10/09/2026</span>
                        </div>
                        <p class="mb-0 text-muted small">
                            Actividad de seguimiento próximo a vencer en la <strong>Zona Norte</strong>. Fecha límite: 10/09/2026.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Alerta 2 -->
            <div class="card notification-card bg-white p-3 shadow-sm border-start border-primary border-4">
                <div class="d-flex align-items-start gap-3">
                    <div class="bg-primary-subtle text-primary p-2 rounded-3 fs-4">
                        <i class="bi bi-info-circle"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="mb-0 fw-semibold text-dark">Recordatorio</h6>
                            <span class="text-muted fs-8"><i class="bi bi-calendar-event"></i> Programado</span>
                        </div>
                        <p class="mb-0 text-muted small">
                            Revisión programada para la campaña de fumigación <strong>#104</strong>.
                        </p>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
