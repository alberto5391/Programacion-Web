<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados_Campaña</title>
</head>
<body>
    <div>
    <h2>Actualización del estado de una campaña (RF27)</h2>
    <form>
        <label for="select_campana">Seleccionar Campaña:</label>
        <select id="select_campana" name="select_campana">
            <option value="c1">Campaña #01</option>
            <option value="c2">Campaña #02</option>
        </select><br><br>

        <label for="estado_campana">Nuevo Estado:</label>
        <select id="estado_campana" name="estado_campana">
            <option value="pendiente">Pendiente</option>
            <option value="proceso">En proceso</option>
            <option value="inspeccionada">Inspeccionada</option>
            <option value="tratada">Tratada</option>
            <option value="seguimiento">En seguimiento</option>
            <option value="finalizada">Finalizada</option>
        </select><br><br>

        <button type="submit">Actualizar Estado</button>
    </form>
</div>

<br><br>
<a href="supervisor-dashboard.html">← Regresar al menú</a>
    
</body>
</html>
