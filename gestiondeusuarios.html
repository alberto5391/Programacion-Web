<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Registro</title>
</head>
<body>

    <h2>Registrar Nuevo Usuario</h2>
    
    <form action="#" method="POST">
        <div>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <br>

        <div>
            <label for="apellidos">Apellidos:</label><br>
            <input type="text" id="apellidos" name="apellidos" required>
        </div>
        <br>

        <div>
            <label for="contacto">Número de contacto:</label><br>
            <input type="tel" id="contacto" name="contacto" required>
        </div>
        <br>

        <div>
            <label for="correo">Correo electrónico:</label><br>
            <input type="email" id="correo" name="correo" required>
        </div>
        <br>

        <div>
            <label for="curp">CURP:</label><br>
            <input type="text" id="curp" name="curp" maxlength="18" required>
        </div>
        <br>

        <div>
            <label for="rfc">RFC:</label><br>
            <input type="text" id="rfc" name="rfc" maxlength="13" required>
        </div>
        <br>

        <div>
            <label for="rol">Rol del usuario:</label><br>
            <select id="rol" name="rol" required>
                <option value="" disabled selected>Selecciona un rol...</option>
                <option value="Administrador">Administrador</option>
                <option value="Supervisor">Supervisor</option>
                <option value="Tecnico">Técnico</option>
            </select>
        </div>
        <br>

        <div>
            <button type="submit">Registrar Usuario</button>
            <button type="reset">Limpiar Formulario</button>
        </div>
    </form>
    <h2>RF02 Gestión de Usuarios</h2>
    <h2>RF03 Modificacion de Usuarios</h2>

</body>
</html>
