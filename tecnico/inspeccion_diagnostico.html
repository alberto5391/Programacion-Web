<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/tecnico.css">
    <title>Inspección y Diagnóstico</title>
</head>
<body>
    <!-- Barra Superior de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                Inspección y Diagnóstico
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="../index.html" class="btn btn-outline-light btn-sm">
                    ← Inicio
                </a>
                <a href="notificaciones.html" class="btn btn-primary btn-sm">
                    Notificaciones
                </a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">Inspección y Diagnóstico en Campo</h2>
        <form>
            <!-- Registro de inspecciones -->
            <fieldset class="border rounded p-4 mb-4 shadow-sm">
                <legend class="float-none w-auto px-2">
                    Registro de inspecciones (RF14)
                </legend>
                <div class="mb-3">
                    <label for="fecha_inspeccion" class="form-label">
                        Fecha:
                    </label>
                    <input
                        type="date"
                        class="form-control"
                        id="fecha_inspeccion"
                        name="fecha_inspeccion">
                </div>
                <div class="mb-3">
                    <label for="ubicacion_inspeccion" class="form-label">
                        Ubicación:
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="ubicacion_inspeccion"
                        name="ubicacion_inspeccion"
                        placeholder="Ingrese la ubicación de la inspección">
                </div>
                <div class="mb-3">
                    <label for="observaciones_insp" class="form-label">
                        Observaciones:
                    </label>
                    <textarea
                        class="form-control"
                        id="observaciones_insp"
                        name="observaciones_insp"
                        rows="3"
                        placeholder="Describa las observaciones encontradas"></textarea>
                </div>
            </fieldset>
            <!-- Registro de diagnóstico -->
            <fieldset class="border rounded p-4 mb-4 shadow-sm">
                <legend class="float-none w-auto px-2">
                    Registro de diagnóstico (RF15)
                </legend>
                <div class="mb-3">
                    <label for="plaga_encontrada" class="form-label">
                        Plaga encontrada:
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="plaga_encontrada"
                        name="plaga_encontrada"
                        placeholder="Ingrese la plaga encontrada">
                </div>
                <div class="mb-3">
                    <label for="nivel_problema" class="form-label">
                        Nivel o situación observada:
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="nivel_problema"
                        name="nivel_problema"
                        placeholder="Describa el nivel del problema">
                </div>
                <div class="mb-3">
                    <label for="caracteristicas" class="form-label">
                        Características relevantes:
                    </label>
                    <textarea
                        class="form-control"
                        id="caracteristicas"
                        name="caracteristicas"
                        rows="3"
                        placeholder="Describa las características relevantes"></textarea>
                </div>
            </fieldset>
            <!-- Botones -->
            <div class="d-flex flex-wrap gap-2 mt-4 mb-4">
                <button
                    type="submit"
                    formaction="tecnico_dashboard.html"
                    class="btn btn-primary">
                    Guardar
                </button>
                <a href="tecnico_dashboard.html"
                   class="btn btn-outline-secondary">
                    ← Regresar al menú
                </a>
            </div>
        </form>
    </div>
</body>
</html>
