<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAGUE - Incidencias</title>
</head>
<body>
    <!-- Inicio del bloque para el RF26: Registro de incidencias -->
    <h1>Registro de Incidencias</h1>
    <p>Formulario para registrar incidencias detectadas en inspecciones o tratamientos.</p>

    <!-- Inicio del bloque simulado para el RF21: Modo offline -->
    <div style="background-color: #fff3cd; padding: 10px; border: 1px solid #ffeeba;">
        <p><strong>Estado de red:</strong> <span id="estado-red">Sin conexión (Modo Offline Activo)</span>. Los datos se guardarán localmente y se sincronizarán al recuperar la conexión.</p>
    </div>
    <br>
    
    <form action="#" method="POST">
        <label>Campaña / Zona:</label><br>
        <input type="text" name="campana" required><br><br>

        <label>Detalle de la incidencia:</label><br>
        <textarea name="detalle" rows="4" cols="50" required></textarea><br><br>

        <button type="submit">Guardar Incidencia Localmente</button>
    </form>
    <!-- Fin del bloque RF26 y RF21 -->

    <br>
    <a href="index.html">Volver al inicio</a>
</body>
</html>
